name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Compile and validate content
        run: dart run tool/build_content.dart

      - name: Run automated test suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Prepare APK artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk presby-hymns.apk

      - name: Upload APK artifact for testing
        uses: actions/upload-artifact@v4
        with:
          name: presby-hymns-apk
          path: presby-hymns.apk
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: presby-hymns.apk
          name: "Presbyterian Hymns ${{ github.ref_name }}"
          generate_release_notes: true
